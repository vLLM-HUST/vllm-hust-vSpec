name: PyPI Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install release tools
        run: |
          python -m pip install pytest "ruff>=0.12"
          python -m pip install "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@main"
          python -m pip install --no-deps --editable .
      - name: Verify source and release tag
        run: |
          ruff check scripts/verify_release.py scripts/verify_model_acceptance.py src/vllm_hust_vspec/run_with_backend.py src/vllm_hust_vspec/runtime_installer.py src/vllm_hust_vspec/_vendor/qwen35_mtp_compat tests/test_release.py tests/test_model_acceptance.py tests/test_run_with_backend.py tests/test_runtime_installer.py tests/test_qwen35_mtp_compat.py
          ruff format --check scripts/verify_release.py scripts/verify_model_acceptance.py src/vllm_hust_vspec/run_with_backend.py src/vllm_hust_vspec/runtime_installer.py src/vllm_hust_vspec/_vendor/qwen35_mtp_compat tests/test_release.py tests/test_model_acceptance.py tests/test_run_with_backend.py tests/test_runtime_installer.py tests/test_qwen35_mtp_compat.py
          bash -n install.sh manage.sh release.sh run.sh uninstall.sh
          python -m compileall -q src/vllm_hust_vspec
          pytest -q tests/test_manifest.py tests/test_extension_lifecycle.py tests/test_management.py tests/test_release.py tests/test_model_acceptance.py tests/test_run_with_backend.py tests/test_runtime_installer.py tests/test_qwen35_mtp_compat.py
          VERSION=$(python -c 'from vllm_hust_vspec._version import __version__; print(__version__)')
          test "$GITHUB_REF_NAME" = "v${VERSION}"
      - name: Require private model-level acceptance receipt
        env:
          VSPEC_MODEL_ACCEPTANCE_RECEIPT: ${{ secrets.VSPEC_MODEL_ACCEPTANCE_RECEIPT }}
        run: |
          python scripts/verify_model_acceptance.py --env VSPEC_MODEL_ACCEPTANCE_RECEIPT --commit "$GITHUB_SHA"
      - name: Build distributions
        run: ./release.sh build
      - name: Publish exact artifacts
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
          VSPEC_MODEL_ACCEPTANCE_RECEIPT: ${{ secrets.VSPEC_MODEL_ACCEPTANCE_RECEIPT }}
        run: |
          VERSION=$(python -c 'from vllm_hust_vspec._version import __version__; print(__version__)')
          VSPEC_RELEASE_CONFIRM="$VERSION" ./release.sh publish
