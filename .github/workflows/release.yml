name: PyPI Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install release tools
        run: |
          python -m pip install pytest "ruff>=0.12"
          python -m pip install "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@main"
          python -m pip install --no-deps --editable .
      - name: Verify source and release tag
        run: |
          ruff check .
          ruff format --check .
          bash -n install.sh manage.sh release.sh run.sh uninstall.sh
          pytest -q tests/test_manifest.py tests/test_extension_lifecycle.py tests/test_management.py tests/test_release.py
          VERSION=$(python -c 'from vllm_hust_vspec._version import __version__; print(__version__)')
          test "$GITHUB_REF_NAME" = "v${VERSION}"
      - name: Build distributions
        run: ./release.sh build
      - name: Publish exact artifacts
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          VERSION=$(python -c 'from vllm_hust_vspec._version import __version__; print(__version__)')
          VSPEC_RELEASE_CONFIRM="$VERSION" ./release.sh publish
