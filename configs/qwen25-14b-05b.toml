[serve]
target_model = "/data/shared-models/Qwen2.5-14B-Instruct"
method = "draft"
served_model_name = "qwen2.5-14b-instruct-fp16"
gamma = 4
max_num_seqs = 128
max_num_batched_tokens = 8192
max_model_len = 32768
dtype = "float16"
block_size = 128
tensor_parallel_size = 1
draft_tensor_parallel_size = 1
gpu_memory_utilization = 0.85
host = "127.0.0.1"
port = 8000
device = "0"
graph_mode = "full-decode-only"
async_scheduling = true
prefix_caching = false
chunked_prefill = true
shared_tokenizer_padding = true
merged_full = true
merged_full_max_batch = 0
capture_policy = "auto"
disable_log_stats = true
vllm_source = "/root/data/vllm-hust-latest"
ascend_source = "/root/data/vllm-ascend-hust-latest"

[env]
VLLM_ASCEND_ENABLE_NZ = "0"
VLLM_ASCEND_TREE_DRAFT_DISABLE_STATS = "1"
VLLM_ASCEND_TORCH_PREFLIGHT = "0"
VLLM_NO_USAGE_STATS = "1"
PYTHONDONTWRITEBYTECODE = "1"
