[serve]
target_model = "/data/shared-models/Qwen2.5-14B-Instruct"
method = "draft"
served_model_name = "qwen2.5-14b-adaptive-draft"
gamma = 4
max_num_seqs = 128
max_num_batched_tokens = 33280
max_model_len = 1024
dtype = "bfloat16"
block_size = 128
tensor_parallel_size = 1
draft_tensor_parallel_size = 1
gpu_memory_utilization = 0.92
host = "127.0.0.1"
port = 8000
device = "2"
graph_mode = "full"
async_scheduling = true
prefix_caching = true
chunked_prefill = true
shared_tokenizer_padding = true
merged_full = true
merged_full_max_batch = 0
capture_policy = "exact"
disable_log_stats = true
confidence_accept_margin = 5.25
adaptive_speculation = true
adaptive_policy = "online"
adaptive_min_gamma = 1
adaptive_control_interval = 2
adaptive_hysteresis = 0.05
adaptive_min_observations = 32
adaptive_max_gamma_step = 1
adaptive_latency_calibration = true
adaptive_latency_ewma_weight = 0.2
adaptive_gamma0_mode = "sticky"
adaptive_full_graph = true
adaptive_async = true
adaptive_online_window = 32
adaptive_online_exploration = 0.01
adaptive_online_warmup_samples = 1
adaptive_online_warmup_return = "best"
adaptive_refill_batch = 8

[env]
VLLM_ASCEND_ENABLE_NZ = "0"
VLLM_ASCEND_TREE_DRAFT_DISABLE_STATS = "1"
VLLM_ASCEND_TORCH_PREFLIGHT = "0"
VLLM_NO_USAGE_STATS = "1"
PYTHONDONTWRITEBYTECODE = "1"
